<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Touchless Media Controller</title>
<style>
:root{--bg:#eef1f6;--ink:#1b2333;--mut:#566074;--blue:#2574ff;--grn:#2fd18b;--red:#ef4b4b;--ln:#e4e8ef;--card:#fff;--soft:#f3f5f9}
@media(prefers-color-scheme:dark){:root{--bg:#10141c;--ink:#e8ecf4;--card:#1a2130;--soft:#232c3f;--ln:#2d3750;--mut:#a3adc0}}
*{box-sizing:border-box;margin:0}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
button,select{font:inherit;color:inherit}button{border:0;background:none;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
#phone{min-height:100vh;display:flex}
.shell{display:flex;flex:1;min-width:0;min-height:100vh;background:var(--b);color:var(--t)}
.light{--b:#fff;--t:#1b2333;--m:#566074;--c:#f3f5f9;--l:#e4e8ef}
.dark{--b:#0b0f17;--t:#f1f4fa;--m:#a3adc0;--c:#1a2130;--l:#262e3f}
.in{width:100%;max-width:520px;display:flex;flex-direction:column;flex:1}.in.wide{max-width:1040px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px 36px;align-items:start}
@media(max-width:900px){.two{grid-template-columns:1fr}}
.brand{font-weight:700;font-size:16px;padding:8px 12px 20px}
.scr{flex:1;display:flex;justify-content:center;min-width:0;padding:clamp(20px,4vw,48px) clamp(16px,5vw,56px)}
h1{font-size:26px;letter-spacing:-.02em}h2{font-size:20px}
.mut{color:var(--m);font-size:13px;line-height:1.45}
.ctr{text-align:center;align-items:center}
.btn{width:100%;padding:15px;border-radius:12px;font-weight:600;background:var(--blue);color:#fff;margin-top:10px}
.btn.g{background:var(--c);color:var(--t)}
.row{display:flex;align-items:center;gap:12px;border:1px solid var(--l);border-radius:12px;padding:12px;margin-bottom:10px;width:100%;text-align:left}
.dark .row{background:var(--c)}.light .row{background:#fff}
.ico{width:36px;height:36px;border-radius:10px;background:var(--c);display:grid;place-items:center;font-size:18px;flex:none}
.grow{flex:1;min-width:0}.grow b{display:block;font-size:14px}.grow span{font-size:12px;color:var(--m)}
.chev{color:var(--m)}
.back{align-self:flex-start;font-size:22px;color:var(--blue);margin-bottom:6px}
.tabs{width:210px;flex:none;border-right:1px solid var(--l);padding:24px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;background:var(--b)}
.tabs button{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--m);padding:10px 12px;border-radius:10px;text-align:left}
.tabs button.on{color:var(--blue);background:var(--c)}.tabs i{font-style:normal;font-size:18px;width:22px;text-align:center}
@media(max-width:900px){.shell{flex-direction:column}.brand{display:none}.tabs{position:fixed;bottom:0;left:0;right:0;width:auto;height:auto;flex-direction:row;justify-content:space-around;border-right:0;border-top:1px solid var(--l);padding:6px 0 10px;z-index:5}.tabs button{flex-direction:column;gap:2px;font-size:11px;padding:4px 10px}.scr{padding-bottom:90px}}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.grid .gc:last-child:nth-child(odd){grid-column:1/-1}
.card{background:var(--c);border:1px solid var(--l);border-radius:16px;padding:18px}
.gc{border:0;background:#121a29;color:#fff;border-radius:14px;padding:16px 8px;text-align:center;font-size:13px}
.gc i{font-style:normal;display:grid;place-items:center;width:38px;height:38px;border-radius:50%;background:#1f3a3a;margin:0 auto 8px;font-size:18px}
.gc small{display:block;color:#a3adc0;font-size:11px}
.note{display:flex;gap:8px;background:var(--c);border-radius:10px;padding:10px;font-size:12px;color:var(--m);margin-top:14px}
.logo{width:120px;height:120px;border-radius:30px;background:var(--blue);display:grid;place-items:center;font-size:60px;margin:40px auto 28px}
.dots{display:flex;gap:6px;justify-content:center;margin:auto 0 16px}.dots b{width:6px;height:6px;border-radius:50%;background:var(--l)}.dots b:first-child{background:var(--blue)}
.cam{position:relative;border-radius:16px;overflow:hidden;background:#222;aspect-ratio:4/3;max-height:30vh;width:100%;display:grid;place-items:center;margin:0 0 10px}
.cam video,.ov{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.box{position:absolute;inset:14% 16%;border:2px solid var(--grn);border-radius:12px;pointer-events:none}
.pill{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);background:#bdf5da;color:#0a6b43;border-radius:20px;padding:5px 12px;font-size:12px;font-weight:600;white-space:nowrap}
.chip{display:inline-flex;align-items:center;gap:6px;background:#12382d;color:#5ff0b0;border-radius:20px;padding:5px 11px;font-size:12px}
.chip.off{background:#3a1a1a;color:#ff9a9a}
.sts{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:10px 0 16px}
.art{border-radius:12px;display:grid;place-items:center;flex:none}
.bar{height:4px;background:var(--l);border-radius:4px;position:relative;margin:8px 0 4px}.bar i{position:absolute;inset:0 auto 0 0;background:var(--blue);border-radius:4px}
.tm{display:flex;justify-content:space-between;font-size:11px;color:var(--m)}
.pl{width:56px;height:56px;border-radius:50%;background:var(--blue);color:#fff;font-size:22px}
.ctl{display:flex;justify-content:space-between;align-items:center;margin:14px 10px}.ctl button{font-size:24px}
.sw{width:46px;height:26px;border-radius:14px;background:var(--l);position:relative;flex:none}.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:var(--blue)}.sw.on::after{left:23px}
.fb{position:fixed;inset:0;z-index:30;background:#0b0f17;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;animation:f .2s}.fb .chip{align-self:center}
@keyframes f{from{opacity:0}}
.ok{width:130px;height:130px;border-radius:50%;border:4px solid var(--grn);background:#0f3a2d;display:grid;place-items:center;font-size:60px;color:var(--grn)}
.bad{border-color:var(--red);background:#3a1620;color:var(--red)}
.ck{list-style:none;padding:0;margin:20px 0;text-align:left;font-size:14px}.ck li{padding:6px 0}.ck li::before{content:"✓ ";color:var(--grn)}
.sec{font-size:12px;color:var(--m);margin:14px 0 8px;font-weight:600}
input[type=range]{width:100%;accent-color:var(--blue)}
select{background:var(--c);border:1px solid var(--l);border-radius:8px;padding:6px;max-width:150px}
.welcome-popup{display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#222;color:#fff;padding:45px 60px;border-radius:22px;font-size: 24px;text-align:center;z-index:9999;box-shadow:0 5px 25px rgba(0,0,0,.5);max-width:90vw}
.welcome-popup.show{display:block;animation:f .25s}
.sr{position:absolute;left:-9999px}
.auth-form{display:flex;flex-direction:column;gap:10px;margin-top:20px}.auth-form label{font-size:13px;font-weight:600}.auth-form input{width:100%;padding:12px;border:1px solid var(--l);border-radius:10px;background:var(--b);color:var(--t)}.auth-error{min-height:18px;color:var(--red);font-size:13px}.auth-switch{color:var(--blue);font-weight:600;padding:12px}
#accountBar{position:fixed;right:18px;top:14px;z-index:20;display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--ln);border-radius:12px;background:var(--card);color:var(--ink);box-shadow:0 3px 12px #0002;font-size:12px}#accountBar[hidden]{display:none}#accountBar button{background:var(--blue);color:white;border-radius:8px;padding:8px 12px;font-weight:600}.history-item{display:flex;align-items:center;gap:12px;width:100%;border:1px solid var(--l);border-radius:12px;padding:12px;margin-bottom:10px;background:var(--b)}.history-item .ico{background:var(--c)}.history-item .grow{min-width:0}.history-item .grow b{display:block;font-size:14px}.history-item .grow span{display:block;color:var(--m);font-size:12px;overflow-wrap:anywhere}.history-item .remove{color:var(--red);padding:8px;font-size:18px}
.cam-ov{display:none;position:fixed;top:16px;right:16px;width:min(320px,calc(100vw - 32px));aspect-ratio:4/3;border-radius:16px;overflow:hidden;background:#222;z-index:35;box-shadow:0 8px 30px #0006;border:2px solid var(--grn)}.cam-ov.show{display:block}.cam-ov video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}.cam-ov .x{position:absolute;top:8px;right:8px;width:30px;height:30px;border-radius:50%;background:#000a;color:#fff}
#demo{position:fixed;right:14px;bottom:14px;z-index:40;width:290px;max-height:80vh;overflow:auto;background:var(--card);color:var(--ink);border:1px solid var(--ln);border-radius:14px;padding:10px 14px;font-size:13px;box-shadow:0 8px 30px #0003}#demo summary{cursor:pointer;font-weight:600}
@media(max-width:900px){#demo{bottom:74px}}
#demo h3{font-size:14px;margin:10px 0 6px}#demo button{background:var(--soft);color:var(--ink);padding:7px 10px;border-radius:8px;margin:3px 3px 3px 0;font-size:12px;border:1px solid var(--ln)}
#demo p{color:var(--mut);margin:6px 0;line-height:1.4}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div id="phone"></div>
<div id="accountBar" hidden><span id="accountName"></span><button data-a="logout">Sign out</button></div>
<div id="welcomePopup" class="welcome-popup" role="status"><h2 id="welcomeMessage">Hello!</h2><p>Welcome to Touchless Media Controller</p></div>
<div id="camOverlay" class="cam-ov" aria-label="Camera preview"><video autoplay playsinline muted></video><div class="box"></div><button class="x" data-a="camtoggle" aria-label="Close camera">✕</button></div>
<div id="live" class="sr" aria-live="polite"></div>
<details id="demo"><summary>Dev panel</summary>
 <p>Simulate what the Python backend (MediaPipe + DollarPy) sends. Keys: Space = circle, arrows = swipes.</p>
 <div id="sim"></div>
 <button data-j="error">Hand not detected</button><button data-a="demoFarah">Demo: recognize Farah</button>
 <h3>Socket bridge</h3><p id="bst">Not connected</p>
 <input id="wsu" value="ws://localhost:8765" aria-label="WebSocket URL" style="width:100%;padding:6px;border-radius:8px;border:1px solid var(--ln)">
 <button id="wsb">Connect</button>
 <h3>Jump to screen</h3><div id="jump"></div>
</details>
<script>
/* ===== Protocol (JSON over WebSocket), default ws://localhost:8765 =====
 backend -> UI: {type:"gesture", id:"play|next|prev|volup|voldown", score:0-1, t:<ms epoch when detected>}
                {type:"landmarks", points:[[x,y]x21] (0-1), trail?:[[x,y]...]}   {type:"nohand"}
                {type:"user", id:"AA:BB..", name:"David", context?:"focus|workout|chill"}   {type:"context", value:"chill"}
 UI -> backend: {type:"action", id, track, volume} | {type:"user", id, name} | {type:"settings", sensitivity, handTracking, performance, wake} */
const $=s=>document.querySelector(s);
const G=[['play','Play / Pause','Circle','◯',' '],['next','Next song','Swipe right','➡','ArrowRight'],['prev','Previous song','Swipe left','⬅','ArrowLeft'],['volup','Volume up','Swipe up','⬆','ArrowUp'],['voldown','Volume down','Swipe down','⬇','ArrowDown']];
const SV=[['YouTube','▶','#ff0033'],['Spotify','≡','#1db954'],['Netflix','N','#e50914'],['Apple Music','♪','#fa4b6a'],['Other / System media','♫','#6b7587']];
const LIB={focus:[['Weightless','Marconi Union','🌙','#1f3a5f'],['Experience','Ludovico Einaudi','🎹','#3b2f5e']],
 workout:[['Blinding Lights','The Weeknd','🔥','#8a1c1c'],['Stronger','Kanye West','⚡','#7a5a10']],
 chill:[['Sunset Lover','Petit Biscuit','🌅','#a0522d'],['Instant Crush','Daft Punk','🎧','#24506b']]};
const S={setup:true,svc:null,ctx:'workout',i:0,play:true,pos:64,vol:68,sens:50,track:true,sound:true,perf:false,cam:false,user:null,history:[]};
const trk=()=>LIB[S.ctx][S.i%2],gx=id=>G.find(g=>g[0]===id);
let route='splash',stream=null,ws=null,authMode='login',requestCounter=0;
const pendingRequests=new Map();
function sendRequest(type,payload){return new Promise((resolve,reject)=>{if(!ws||ws.readyState!==1){reject(new Error('Cannot reach the local app server. Start the app with python main.py.'));return}
 const request_id=String(++requestCounter);pendingRequests.set(request_id,{resolve,reject});ws.send(JSON.stringify({type,request_id,...payload}));setTimeout(()=>{if(pendingRequests.has(request_id)){pendingRequests.delete(request_id);reject(new Error('The server did not respond.'))}},8000)})}
function esc(value){return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function loadHistory(){if(!S.user)return;sendRequest('history',{action:'list',session:S.user.session}).then(r=>{S.history=r.items||[];if(route==='history')render()}).catch(()=>{})}
function addHistory(event,item=trk()[0]){if(!S.user)return;sendRequest('history',{action:'add',session:S.user.session,service:S.svc||'Other / System media',item,event}).then(loadHistory).catch(()=>{})}

/* ---- welcome popup ---- */
function showWelcome(name){const popup=document.getElementById("welcomePopup");const message=document.getElementById("welcomeMessage");message.textContent="Hello, "+name+"!";message.style.fontSize = "32px";popup.classList.add("show");setTimeout(()=>{popup.classList.remove("show")},5000)}
const bridge={send(o){if(ws&&ws.readyState===1)ws.send(JSON.stringify(o))},
 connect(u){try{ws=new WebSocket(u)}catch(e){return}
  ws.onopen=()=>$('#bst').textContent='Connected to '+u;ws.onclose=ws.onerror=()=>$('#bst').textContent='Not connected (demo mode)';
  ws.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch{return}
   if(m.type==='auth_result'||m.type==='history_result'){const pending=pendingRequests.get(m.request_id);if(pending){pendingRequests.delete(m.request_id);m.ok?pending.resolve(m):pending.reject(new Error(m.error||'Request failed.'))}return}
   if(m.type==='gesture')act(m.id);else if(m.type==='context')setCtx(m.value);
   else if(m.type==='nohand')go('error');
   else if(m.type==='user'){
    S.nearbyUser=m.name||m.id;

    showWelcome(m.name);

    if(m.context)setCtx(m.context);
   }}}};
function setCtx(c){if(LIB[c]){S.ctx=c;S.i=0;S.pos=0;render()}}
function act(id){const g=gx(id);if(!g)return;
 if(id==='play')S.play=!S.play;
 if(id==='next'){S.i++;S.pos=0}
 if(id==='prev'){S.i=Math.max(0,S.i-1);S.pos=0}
 if(id==='volup')S.vol=Math.min(100,S.vol+10);
 if(id==='voldown')S.vol=Math.max(0,S.vol-10);
 const actionNames={play:S.play?'Resumed playback':'Paused playback',next:'Skipped to next item',prev:'Returned to previous item',volup:'Turned volume up',voldown:'Turned volume down'};
 addHistory(actionNames[id],trk()[0]);
 bridge.send({type:'action',id,track:trk()[0],volume:S.vol});
 render();
 if(S.sound)beep();
 const f=document.createElement('div');f.className='fb';
 f.innerHTML=`<div class="ok">✓</div><h1>${g[1]}</h1><p class="mut">Gesture recognized</p><div class="chip">Command sent successfully</div><p class="mut" style="margin-top:40px;font-size:11px">Closes automatically</p>`;
 document.body.append(f);setTimeout(()=>f.remove(),1500)}
function beep(){try{const a=new AudioContext(),o=a.createOscillator();o.connect(a.destination);o.frequency.value=660;o.start();o.stop(a.currentTime+.08)}catch{}}
async function getStream(){if(stream)return true;try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'}});return true}catch{return false}}
function stopStream(){if(stream)stream.getTracks().forEach(t=>t.stop());stream=null}
async function camToggle(){if(S.cam){S.cam=false;stopStream()}else if(await getStream())S.cam=true;else alert('Camera unavailable or permission denied.');
 const o=$('#camOverlay'),v=o.querySelector('video');o.classList.toggle('show',S.cam);v.srcObject=S.cam?stream:null;render()}
async function bt(){try{const d=await navigator.bluetooth.requestDevice({acceptAllDevices:true});S.nearbyUser=d.name||d.id;bridge.send({type:'user',id:S.nearbyUser});render()}
 catch(e){alert('Bluetooth unavailable or cancelled ('+e.message+'). Web Bluetooth needs Chrome/Edge on https or localhost.')}}
/* ---- templates ---- */
const scr=(cls,body,tab,wide)=>`<div class="shell dark">${tab?tabs(tab):''}<main class="scr"><div class="in${wide?' wide':''}">${body}</div></main></div>`;
const tabs=a=>`<nav class="tabs" aria-label="Main"><div class="brand">✋ Touchless</div>${[['home','⌂','Home'],['gestures','✋','Gestures'],['history','◷','History'],['settings','⚙','Settings']].map(t=>`<button data-j="${t[0]}" class="${a===t[0]?'on':''}"><i>${t[1]}</i>${t[2]}</button>`).join('')}</nav>`;
const back=t=>`<button class="back" data-j="${t}" aria-label="Back">←</button>`;
const mrow=(i,t,s,j)=>`<button class="row" data-j="${j}"><span class="ico">${i}</span><span class="grow"><b>${t}</b><span>${s}</span></span><span class="chev">›</span></button>`;
const tog=(k,t,s)=>`<div class="row"><span class="grow"><b>${t}</b>${s?`<span>${s}</span>`:''}</span><button class="sw ${S[k]?'on':''}" data-t="${k}" role="switch" aria-checked="${!!S[k]}" aria-label="${t}"></button></div>`;
const gcs=(f)=>G.map(g=>f(g)).join('');
const fmt=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
const pl=(t,big)=>`<div class="card"><div style="display:flex;gap:16px;align-items:center">${big?'':`<div class="art" style="width:110px;height:110px;font-size:48px;background:${t[3]}">${t[2]}</div>`}<div class="grow"><p class="mut">Now playing${S.user?' · '+S.user.name:''}</p><h2 style="margin:2px 0">${t[0]}</h2><p class="mut">${t[1]}</p></div></div><div class="bar" style="margin-top:20px"><i id="bar" style="width:${S.pos/2}%"></i></div><div class="tm"><span id="tl">${fmt(S.pos)}</span><span>3:20</span></div>
<div class="ctl"><button data-act="prev" aria-label="Previous">⏮</button><button class="pl" data-act="play" aria-label="Play or pause">${S.play?'❚❚':'▶'}</button><button data-act="next" aria-label="Next">⏭</button></div>
<div style="display:flex;gap:10px;align-items:center">🔈<input type="range" min="0" max="100" value="${S.vol}" data-vol aria-label="Volume"><span class="mut">${S.vol}%</span></div>
<p class="sec">Context playlist</p><div>${Object.keys(LIB).map(c=>`<button class="chip ${c===S.ctx?'':'off'}" style="${c===S.ctx?'':'background:var(--b);color:var(--m)'};margin-right:6px" data-ctx="${c}">${c}</button>`).join('')}</div></div>`;
const V={
splash:()=>scr('light',`<div class="ctr" style="display:flex;flex-direction:column;flex:1"><div class="logo">✋</div><h1>Touchless Media<br>Controller</h1><p class="mut" style="margin-top:12px">Control your favorite media with simple, natural hand gestures.</p><div class="dots"><b></b><b></b><b></b></div><button class="btn" data-j="auth">Sign in or create account</button><p class="mut" style="margin-top:10px">Hands-free. Simple. Private.</p></div>`),
auth:()=>scr('light',`<button class="back" data-j="splash" aria-label="Back">←</button><h1>${authMode==='login'?'Welcome back':'Create your account'}</h1><p class="mut" style="margin-top:8px">Your media activity history is saved to your account.</p><form id="authForm" class="auth-form">${authMode==='signup'?'<label for="authName">Name</label><input id="authName" name="name" autocomplete="name" required maxlength="80" placeholder="Your name">':''}<label for="authEmail">Email</label><input id="authEmail" name="email" type="email" autocomplete="email" required placeholder="you@example.com"><label for="authPassword">Password</label><input id="authPassword" name="password" type="password" autocomplete="${authMode==='login'?'current-password':'new-password'}" minlength="8" required placeholder="At least 8 characters"><p id="authError" class="auth-error" role="alert"></p><button class="btn" type="submit">${authMode==='login'?'Sign in':'Create account'}</button></form><button class="auth-switch" data-a="authMode">${authMode==='login'?"New here? Create an account":"Already have an account? Sign in"}</button><p class="mut" style="margin-top:auto;font-size:11px">Accounts and history are stored locally on this computer.</p>`),
camera:()=>scr('light',`<div class="ctr" style="display:flex;flex-direction:column;flex:1"><div class="ico" style="width:110px;height:110px;border-radius:50%;font-size:44px;margin:40px auto 20px">📷</div><h1>Camera Access</h1><p class="mut" style="margin:10px 0 20px">We use your camera to recognize hand gestures during playback.</p><div class="note" style="margin:0 0 auto;text-align:left">🛡<span><b style="color:var(--t)">Privacy first</b><br>Designed for on-device processing. No video recordings are stored.</span></div><button class="btn" data-a="allow">Allow camera access</button><button class="btn g" data-j="service">Not now</button></div>`),
service:()=>scr('light',`${back(S.setup?'auth':'settings')}<h2>Choose a media service</h2><p class="mut" style="margin:8px 0 18px">Choose the service you use. Your activity will appear in your account history.</p>${SV.map(s=>`<button class="row" data-sv="${s[0]}"><span class="ico" style="background:${s[2]};color:#fff;font-weight:700">${s[1]}</span><span class="grow"><b>${s[0]}</b></span><span class="chev">›</span></button>`).join('')}<p class="mut" style="margin-top:auto;text-align:center;font-size:11px">Service selection records demo activity; it does not link or control the service.</p>`,S.setup?null:'settings'),
guide:()=>scr('light',`${back('service')}<h2 style="text-align:center">Gesture Guide</h2><p class="mut" style="text-align:center;margin:8px 0 16px">Learn these simple gestures to control your media without touching the screen.</p><div class="grid">${gcs(g=>`<div class="gc"><i>${g[3]}</i>${g[1]}<small>${g[2]}</small></div>`)}</div><div class="note">ⓘ Keep your hand in view and move slowly.</div><button class="btn" data-j="home">Start controlling</button>`),
home:()=>{const t=trk();return scr('dark',`<div style="display:flex;justify-content:space-between;align-items:center"><h2>Hands-free controller</h2><button data-j="camset" aria-label="Camera settings">⚙</button></div><div class="sts"><span class="chip ${S.cam?'':'off'}">● ${S.cam?'Camera active':'Camera off'}</span></div>
<div class="two">${pl(t)}<div><button class="btn ${S.cam?'':'g'}" data-a="camtoggle" aria-pressed="${S.cam}">📷 ${S.cam?'Close camera':'Open camera'}</button><p class="sec">Gestures</p><div class="grid">${gcs(g=>`<button class="gc" data-act="${g[0]}"><i>${g[3]}</i>${g[1]}<small>${g[2]}</small></button>`)}</div></div></div>`,'home',true)},
playing:()=>{const t=trk();return scr('dark',`<div class="two"><div class="art" style="width:100%;aspect-ratio:1;max-height:60vh;font-size:clamp(60px,12vw,120px);background:${t[3]}">${t[2]}</div>${pl(t,true)}</div>`,'home',true)},
gestures:()=>scr('light',`${back('home')}<h2>Gesture Settings</h2><p class="sec">Recognized gestures</p>${G.map(g=>`<button class="row" data-act="${g[0]}"><span class="ico">${g[3]}</span><span class="grow"><b>${g[1]}</b><span>${g[2]}</span></span><span class="chev">›</span></button>`).join('')}<div class="note">ⓘ Tap a gesture to review or change its assigned action.</div>`,'gestures'),
camset:()=>scr('light',`${back('home')}<h2>Camera Settings</h2><p class="sec">Detection preferences</p>${mrow('📷','Camera','Front-facing camera','camset')}<div class="row" style="display:block"><div style="display:flex;justify-content:space-between"><b style="font-size:14px">Detection sensitivity</b><span class="mut">${S.sens<34?'Low':S.sens<67?'Medium':'High'}</span></div><input type="range" min="0" max="100" value="${S.sens}" data-sens aria-label="Detection sensitivity"><div class="tm"><span>Less sensitive</span><span>More sensitive</span></div></div>${tog('track','Show hand tracking')}${tog('sound','Gesture feedback sound')}${tog('perf','Performance mode','Improves detection on lower-end devices.')}<div class="note">🛡 Camera processing is designed to remain on your device.</div>`),
error:()=>scr('dark',`<div class="ctr" style="display:flex;flex-direction:column;flex:1"><div class="ok bad" style="margin-top:40px">⚠</div><h1 style="margin-top:18px">Hand not detected</h1><p class="mut" style="margin-top:8px">We cannot see a clear hand in the frame.</p><ul class="ck"><li>Make sure your hand is visible</li><li>Move into better lighting</li><li>Adjust your distance from the camera</li></ul><button class="btn" data-j="home" style="margin-top:auto">Try again</button><button class="btn g" data-j="guide">View tips</button></div>`),
history:()=>scr('light',`<div style="display:flex;justify-content:space-between;align-items:center"><h2>Media History</h2>${S.history.length?'<button class="auth-switch" data-a="clearHistory">Clear all</button>':''}</div><p class="mut" style="margin:6px 0 16px">${S.user?`${esc(S.user.name)} · ${esc(S.svc||'Choose a service')}`:'Sign in to view your history'}</p>${S.history.length?S.history.map(h=>`<div class="history-item"><span class="ico">♫</span><span class="grow"><b>${esc(h.item)}</b><span>${esc(h.action)} · ${esc(h.service)} · ${new Date(h.created_at+'Z').toLocaleString()}</span></span><button class="remove" data-a="removeHistory" data-id="${h.id}" aria-label="Remove ${esc(h.item)} from history" title="Remove">×</button></div>`).join(''):'<div class="note">No activity yet. Choose a service and use the player controls or gestures.</div>'}<div class="note">Your history is saved to your account on this computer.</div>`,'history'),
settings:()=>scr('light',`<h2>Settings</h2><p class="mut" style="margin:6px 0 16px">Signed in as ${esc(S.user?.name||'Guest')}${S.user?.email?' · '+esc(S.user.email):''}</p>${mrow('♫','Connected Service',S.svc||'Not connected','service')}<p class="sec">PREFERENCES</p>${mrow('✋','Gesture Settings','Customize your commands','gestures')}${mrow('📷','Camera Settings','Detection & privacy','camset')}<button class="row" data-a="bt"><span class="ico">ᛒ</span><span class="grow"><b>Nearby user (Bluetooth)</b><span>${S.nearbyUser?'Identified: '+esc(S.nearbyUser):'Scan to identify you'}</span></span><span class="chev">›</span></button><button class="btn g" data-a="logout">Sign out</button>`,'settings'),
};
/* ---- router / events ---- */
function go(r){if(r==='splash')S.setup=true;if(r==='home')S.setup=false;route=r;location.hash=r;render()}
function render(){const p=$('#phone');p.innerHTML=V[route]();const accountBar=$('#accountBar');accountBar.hidden=!S.user;$('#accountName').textContent=S.user?`Signed in: ${S.user.name}`:'';
 const j=$('#jump');if(!j.children.length)j.innerHTML=Object.keys(V).map(k=>`<button data-j="${k}">${k}</button>`).join('')}
document.addEventListener('submit',async e=>{if(e.target.id!=='authForm')return;e.preventDefault();const form=e.target,submit=form.querySelector('button[type="submit"]'),error=$('#authError');submit.disabled=true;submit.textContent=authMode==='login'?'Signing in…':'Creating account…';error.textContent='';
 try{const values=Object.fromEntries(new FormData(form));const result=await sendRequest('auth',{action:authMode,...values});S.user={...result.user,session:result.session};S.setup=true;loadHistory();go('service')}
 catch(err){error.textContent=err.message;submit.disabled=false;submit.textContent=authMode==='login'?'Sign in':'Create account'}});
document.addEventListener('click',async e=>{const el=e.target.closest('[data-j],[data-a],[data-act],[data-sv],[data-t],[data-ctx]');if(!el)return;const d=el.dataset;
 if(d.j){if(d.j==='splash'&&!S.user)go('splash');else if(['home','history','settings','gestures','camset'].includes(d.j)&&!S.user)go('auth');else go(d.j)}
 else if(d.sv){S.svc=d.sv;addHistory('Selected service',trk()[0]);go(S.setup?'guide':'settings')}
 else if(d.act)act(d.act);
 else if(d.ctx)setCtx(d.ctx);
 else if(d.t){S[d.t]=!S[d.t];bridge.send({type:'settings',sensitivity:S.sens,handTracking:S.track,performance:S.perf});render()}
 else if(d.a==='allow'){if(await getStream())stopStream();go('service')}
 else if(d.a==='camtoggle')camToggle();
 else if(d.a==='authMode'){authMode=authMode==='login'?'signup':'login';render()}
 else if(d.a==='logout'){const session=S.user?.session;S.user=null;S.history=[];S.svc=null;S.setup=true;if(session)sendRequest('auth',{action:'logout',session}).catch(()=>{});go('auth')}
 else if(d.a==='removeHistory'){sendRequest('history',{action:'delete',session:S.user?.session,item_id:d.id}).then(loadHistory).catch(err=>alert(err.message))}
 else if(d.a==='clearHistory'){if(confirm('Clear all history for this account?'))sendRequest('history',{action:'clear',session:S.user?.session}).then(loadHistory).catch(err=>alert(err.message))}
 else if(d.a==='demoFarah'){S.nearbyUser='Farah';showWelcome('Farah');render()}
 else if(d.a==='bt')bt();
 ;});
document.addEventListener('input',e=>{const t=e.target;
 if('vol' in t.dataset){S.vol=+t.value;t.nextElementSibling.textContent=S.vol+'%'}
 if('sens' in t.dataset){S.sens=+t.value;t.closest('.row').querySelector('.mut').textContent=S.sens<34?'Low':S.sens<67?'Medium':'High';bridge.send({type:'settings',sensitivity:S.sens})}});
document.addEventListener('keydown',e=>{if(['INPUT','SELECT'].includes(e.target.tagName))return;const g=G.find(x=>x[4]===e.key);if(g){e.preventDefault();act(g[0])}});
$('#sim').innerHTML=G.map(g=>`<button data-act="${g[0]}">${g[3]} ${g[1]}</button>`).join('');
$('#wsb').onclick=()=>bridge.connect($('#wsu').value);
setInterval(()=>{if(S.play&&(route==='home'||route==='playing')){S.pos=(S.pos+1)%200;const b=$('#bar');if(b){b.style.width=S.pos/2+'%';$('#tl').textContent=fmt(S.pos)}}},1000);
route=location.hash.slice(1);if(!V[route]||!['splash','auth'].includes(route))route='splash';render();bridge.connect('ws://localhost:8765');
</script></body></html>
